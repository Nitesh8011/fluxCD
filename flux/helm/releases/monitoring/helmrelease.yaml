apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: monitoring
  namespace: flux-system
spec:
  interval: 10m
  chart:
    spec:
      chart: ./flux/monitoring
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      valuesFiles:
        - flux/monitoring/values.yaml
  install:
    createNamespace: true
  targetNamespace: flux-monitoring-ns