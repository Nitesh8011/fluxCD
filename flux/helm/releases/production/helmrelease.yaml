apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nginx-app
  namespace: flux-system
spec:
  interval: 10m
  chart:
    spec:
      chart: ./flux/helm/nginx-app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      valuesFiles:
        - flux/helm/nginx-app/values-production.yaml
  targetNamespace: production-helm-ns